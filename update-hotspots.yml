name: Update Daily Hotspots

on:
  schedule:
    # 北京时间每天 08:17 = UTC 00:17；避开 GitHub Actions 整点高峰
    - cron: "17 0 * * *"
    # 北京时间每天 08:47 = UTC 00:47；备用补跑，若当天已成功更新脚本会自动跳过
    - cron: "47 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch daily hotspots
        run: node scripts/fetch-daily-hotspots.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily hotspots"
          file_pattern: data/hotspots.json
