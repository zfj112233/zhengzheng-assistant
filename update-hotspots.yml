name: Update Daily Hotspots

on:
  schedule:
    # Beijing time 05:55 = UTC 21:55 (previous day). Run early so GitHub delay still lands before 08:00.
    - cron: "55 21 * * *"
    # Beijing time 06:07 = UTC 22:07. Backup attempt.
    - cron: "7 22 * * *"
    # Beijing time 06:22 = UTC 22:22. Backup attempt.
    - cron: "22 22 * * *"
    # Beijing time 06:37 = UTC 22:37. Backup attempt.
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch daily hotspots
        run: node scripts/fetch-daily-hotspots.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily hotspots"
          file_pattern: data/hotspots.json
